name: Release

# Push a tag such as v1.0.0 to build the installable package and attach it to a GitHub release (both dist/*.zip files: versioned and fixed name).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test
        run: dotnet test --configuration Release --filter "Category!=UI" -p:CoverageReport=false

      - name: Package
        shell: pwsh
        run: scripts/package.ps1 -Version ("${{ github.ref_name }}" -replace '^v', '')

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem dist/*.zip).FullName --title "ContactManage ${{ github.ref_name }}" --generate-notes
